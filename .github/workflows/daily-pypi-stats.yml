name: Refresh PyPI stats and deploy

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/daily-pypi-stats.yml"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Refresh stats and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    env:
      CI: "true"
    steps:
      - name: Check out the current source
        uses: actions/checkout@v7.0.1
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the stats refresh and fallback behavior
        run: npm run test:stats

      - name: Refresh the download counts
        run: npm run refresh:stats

      - name: Test the webpage
        run: npm test -- --watch=false --runInBand

      - name: Build the static site
        run: npm run build

      - name: Save the latest successful stats snapshot
        run: |
          if ! git diff --quiet -- src/data/pypi-stats.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/pypi-stats.json
            git commit -m "Update PyPI download statistics"
            git push origin HEAD:master
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload the generated website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
